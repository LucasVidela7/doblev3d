{% load static %}
{% if request.resolver_match.view_name == 'kits:nuevo' or request.resolver_match.view_name == 'kits:editar' %}
<link rel="stylesheet" href="{% static 'kits/precios_fijos.css' %}">
<script
    src="{% static 'kits/precios_fijos.js' %}"
    data-recomendacion-fija-url="{% url 'kits:recomendacion_fija' %}"
    data-recomendacion-libre-url="{% url 'kits:recomendacion_libre' %}"
    defer
></script>
{% endif %}
<style>
    /* Compatibilidad para encabezados antiguos que incluyen brand_bar dentro
       de un div sin la clase encabezado-marca. Evita que el logo absoluto se
       posicione contra la página completa. */
    .encabezado > div:not([class]):has(> .brand-bar),
    .encabezado-pagina > div:not([class]):has(> .brand-bar),
    .header > div:not([class]):has(> .brand-bar),
    .h > div:not([class]):has(> .brand-bar),
    .topbar > div:not([class]):has(> .brand-bar){
        position:relative;
        min-width:0;
        min-height:48px;
        padding-left:64px;
    }
    @media(max-width:720px){
        .encabezado > div:not([class]):has(> .brand-bar),
        .encabezado-pagina > div:not([class]):has(> .brand-bar),
        .header > div:not([class]):has(> .brand-bar),
        .h > div:not([class]):has(> .brand-bar),
        .topbar > div:not([class]):has(> .brand-bar){
            min-height:44px;
            padding-left:55px;
        }

        /* La insignia flotante de QA debe quedar por encima de la barra
           inferior y no tapar la última opción de navegación. */
        html[data-dv-env="qa"] body::after{
            right:8px!important;
            bottom:82px!important;
        }
    }
</style>
<div class="brand-bar">
    <a class="brand-bar__link" href="{% url 'dashboard:inicio' %}" aria-label="Ir al inicio de Doble V 3D">
        <img class="brand-bar__logo" src="{% static 'brand/logo.png' %}" alt="Logo de Doble V 3D" width="50" height="38">
    </a>
</div>
{% if request.resolver_match.view_name == 'calculadora:precios' and config %}
<style>
    .dv-calculadora-filamento-info{
        margin-top:7px;
        padding-top:7px;
        border-top:1px solid #e5e7eb;
        font-size:11px;
        line-height:1.45;
        font-weight:800;
        color:#4f5660;
    }
</style>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const caja = document.querySelector(".config");
        if (!caja || document.getElementById("dv-calculadora-filamento-info")) return;

        const info = document.createElement("div");
        info.id = "dv-calculadora-filamento-info";
        info.className = "dv-calculadora-filamento-info";

        {% if resultado_nuevo %}
            info.textContent = "Esta cotización usa {% if resultado_nuevo.desglose.filamento_economico %}filamento para cantidad{% else %}filamento estándar{% endif %}: ${{ resultado_nuevo.desglose.precio_filamento_kg|floatformat:'0g' }}/kg. Regla: x1–x4 estándar · x5+ económico.";
        {% elif resultado_existente %}
            info.textContent = "Esta cotización usa {% if resultado_existente.desglose.filamento_economico %}filamento para cantidad{% else %}filamento estándar{% endif %}: ${{ resultado_existente.desglose.precio_filamento_kg|floatformat:'0g' }}/kg. Regla: x1–x4 estándar · x5+ económico.";
        {% elif config.coste_plastico_kg_cantidad %}
            info.textContent = "Regla de cantidad: x1–x4 usa el filamento estándar · x5+ y kits usan ${{ config.coste_plastico_kg_cantidad_efectivo|floatformat:'0g' }}/kg.";
        {% else %}
            info.textContent = "Filamento para cantidad sin configurar: x5+ y kits usan por ahora el mismo costo estándar.";
        {% endif %}

        caja.appendChild(info);
    });
</script>
{% endif %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        function convertirEnIcono(accion, icono, etiqueta, clase) {
            accion.textContent = icono;
            accion.setAttribute("aria-label", etiqueta);
            accion.setAttribute("title", etiqueta);
            accion.classList.add(clase);
        }

        document.querySelectorAll(".brand-bar").forEach(function (marca) {
            const padre = marca.parentElement;
            const encabezado = marca.closest(
                ".encabezado, .encabezado-pagina, .header, .h, .topbar"
            );

            /* Fallback para navegadores sin :has() y plantillas antiguas. */
            if (
                encabezado
                && padre
                && padre !== encabezado
                && !padre.classList.contains("encabezado-marca")
            ) {
                padre.classList.add("encabezado-marca");
            }

            if (!encabezado) return;

            encabezado.querySelectorAll("a, button").forEach(function (accion) {
                const texto = accion.textContent.trim().replace(/\s+/g, " ");

                if (texto === "← VOLVER") {
                    convertirEnIcono(accion, "←", "Volver", "brand-header-icon");
                } else if (texto === "INICIO") {
                    convertirEnIcono(accion, "⌂", "Ir al inicio", "brand-header-icon");
                } else if (/^(?:✎\s*)?EDITAR(?:\s+PRODUCTO)?$/i.test(texto)) {
                    convertirEnIcono(accion, "✎", texto.replace(/^✎\s*/i, ""), "brand-action-icon");
                } else if (/^(?:\+|＋)?\s*(?:NUEV[OA](?:\s+PRODUCTO|\s+KIT)?|PRODUCTO\s+NUEVO)$/i.test(texto)) {
                    convertirEnIcono(accion, "＋", texto.replace(/^(?:\+|＋)\s*/i, ""), "brand-action-icon");
                }
            });
        });

        document.querySelectorAll("a, button").forEach(function (accion) {
            if (accion.closest(".encabezado, .encabezado-pagina, .header, .h, .topbar")) return;

            const texto = accion.textContent.trim().replace(/\s+/g, " ");
            if (/^(?:✎\s*)?EDITAR(?:\s+(?:PRODUCTO|PEDIDO|KIT))?$/i.test(texto)) {
                convertirEnIcono(accion, "✎", texto.replace(/^✎\s*/i, ""), "brand-action-icon");
            }
        });
    });
</script>
