{% if messages %}
<div class="messages dv-django-messages" aria-live="polite" hidden>
    {% for message in messages %}
        <div
            class="message {{ message.tags|default:'info' }}"
            data-dv-toast
            data-dv-toast-type="{{ message.tags|default:'info' }}"
        >{{ message }}</div>
    {% endfor %}
</div>
{% endif %}
