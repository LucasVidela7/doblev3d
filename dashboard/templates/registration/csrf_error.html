{% load static %}
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sesión vencida | Doble V 3D</title>
<link rel="icon" href="{% static 'brand/favicon.ico' %}">
<link rel="stylesheet" href="{% static 'brand/brand.css' %}">
<style>
*{box-sizing:border-box}
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:#f4f5f7;color:#24272b;font-family:Arial,sans-serif}
.card{width:min(430px,100%);padding:28px;border:1px solid #e5e7eb;border-radius:24px;background:#fff;box-shadow:0 20px 55px rgba(20,25,35,.12);text-align:center}
.logo{width:70px;height:54px;object-fit:contain;margin-bottom:14px}
h1{margin:0;font-size:24px}p{margin:10px 0 20px;color:#73777f;font-size:13px;line-height:1.5}
a{min-height:50px;display:inline-flex;align-items:center;justify-content:center;width:100%;border-radius:13px;background:#24272b;color:#fff;text-decoration:none;font-size:11px;font-weight:900}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="{% static 'brand/logo.png' %}" alt="Doble V 3D">
<h1>Actualizá el acceso</h1>
<p>La sesión o el formulario de acceso cambió mientras estabas ingresando. Volvé a cargar el login y probá nuevamente.</p>
<a href="{{ login_url }}">VOLVER A INGRESAR</a>
</main>
</body>
</html>
