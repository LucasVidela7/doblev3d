<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Nuevo Pedido | Doble V 3D
    </title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            font-family:
                Arial,
                sans-serif;

            background: #f4f5f7;
            color: #333333;
        }

        .contenedor {
            max-width: 1200px;
            margin: auto;
        }


        /* =========================================
           ENCABEZADO
        ========================================= */

        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 5px 0;
        }

        .subtitulo {
            color: #777777;
        }

        .acciones-encabezado {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .boton-volver {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            height: 42px;

            padding: 0 16px;

            background: white;

            border:
                1px solid #dddddd;

            border-radius: 8px;

            color: #333333;

            font-size: 12px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 2px 8px rgba(0,0,0,.07);
        }

        .boton-volver:hover {
            background: #eeeeee;
        }

        .boton-inicio {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            height: 42px;

            padding: 0 16px;

            background: #333333;

            border-radius: 8px;

            text-decoration: none;

            color: white;

            font-size: 12px;
            font-weight: bold;
        }

        .boton-inicio:hover {
            background: #111111;
        }


        /* =========================================
           MENSAJES
        ========================================= */

        .mensaje {
            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 15px;

            font-size: 13px;
            font-weight: bold;
        }

        .mensaje.success {
            background: #d4edda;
            color: #155724;
        }

        .mensaje.error {
            background: #f8d7da;
            color: #721c24;
        }


        /* =========================================
           TARJETAS
        ========================================= */

        .tarjeta {
            background: white;

            border-radius: 12px;

            padding: 22px;

            margin-bottom: 20px;

            box-shadow:
                0 2px 8px rgba(0,0,0,.07);
        }

        .tarjeta-titulo {
            margin-bottom: 18px;

            font-size: 14px;
            font-weight: bold;

            color: #444444;
        }


        /* =========================================
           FORMULARIO
        ========================================= */

        .grid-principal {
            display: grid;

            grid-template-columns:
                2fr
                1fr;

            gap: 15px;
        }

        .campo {
            min-width: 0;
        }

        .campo label {
            display: block;

            margin-bottom: 6px;

            font-size: 11px;
            font-weight: bold;

            color: #666666;
        }

        input,
        select,
        textarea {
            width: 100%;

            border:
                1px solid #cccccc;

            border-radius: 7px;

            background: white;

            font-family:
                Arial,
                sans-serif;

            font-size: 14px;
        }

        input,
        select {
            height: 42px;

            padding:
                8px
                10px;
        }

        textarea {
            min-height: 85px;

            padding: 10px;

            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;

            border-color: #666666;
        }


        /* =========================================
           NUEVO CLIENTE
        ========================================= */

        .nuevo-cliente {
            display: none;

            margin-top: 18px;

            padding: 18px;

            border-radius: 10px;

            background: #f8f9fa;

            border:
                1px solid #e4e4e4;
        }

        .nuevo-cliente.activo {
            display: block;
        }

        .nuevo-cliente-titulo {
            margin-bottom: 14px;

            font-size: 11px;
            font-weight: bold;

            color: #666666;
        }

        .nuevo-cliente-grid {
            display: grid;

            grid-template-columns:
                2fr
                1fr
                1fr;

            gap: 12px;
        }


        /* =========================================
           ITEMS
        ========================================= */

        .item {
            position: relative;

            padding: 18px;

            margin-bottom: 15px;

            border:
                1px solid #e2e2e2;

            border-radius: 10px;

            background: #fafafa;
        }

        .item:last-child {
            margin-bottom: 0;
        }

        .item-encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;

            margin-bottom: 15px;
        }

        .item-numero {
            font-size: 13px;
            font-weight: bold;
        }

        .item-grid {
            display: grid;

            grid-template-columns:
                180px
                minmax(250px, 1fr)
                120px;

            gap: 12px;

            align-items: end;
        }


        /* =========================================
           KIT
        ========================================= */

        .selector-producto-normal {
            display: block;
        }

        .selector-kit {
            display: none;
        }

        .componentes-kit {
            display: none;

            margin-top: 16px;

            padding: 16px;

            background: #ffffff;

            border:
                1px solid #e1e1e1;

            border-radius: 9px;
        }

        .componentes-kit.activo {
            display: block;
        }

        .componentes-titulo {
            margin-bottom: 5px;

            font-size: 12px;
            font-weight: bold;
        }

        .componentes-ayuda {
            margin-bottom: 15px;

            color: #777777;

            font-size: 12px;

            line-height: 1.4;
        }

        .componentes-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;
        }

        .componente-kit {
            min-width: 0;
        }


        /* =========================================
           BOTONES
        ========================================= */

        button {
            font-family:
                Arial,
                sans-serif;
        }

        .boton {
            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 12px;
            font-weight: bold;

            text-decoration: none;
        }

        .boton-agregar {
            margin-top: 15px;

            padding:
                11px
                16px;

            background: #eeeeee;

            color: #333333;
        }

        .boton-agregar:hover {
            background: #dddddd;
        }

        .boton-eliminar {
            padding:
                7px
                10px;

            background: #f8d7da;

            color: #721c24;
        }

        .boton-eliminar:hover {
            background: #f1bfc3;
        }

        .acciones {
            display: flex;
            justify-content: flex-end;

            margin-top: 20px;
        }

        .boton-guardar {
            padding:
                13px
                25px;

            background: #333333;

            color: white;

            font-size: 13px;
        }

        .boton-guardar:hover {
            background: #111111;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 850px) {

            body {
                padding: 10px;
            }

            .encabezado {
                flex-direction: column;
                align-items: flex-start;
            }

            .acciones-encabezado {
                width: 100%;
            }

            .boton-volver,
            .boton-inicio {
                flex: 1;
            }

            .grid-principal {
                grid-template-columns: 1fr;
            }

            .nuevo-cliente-grid {
                grid-template-columns: 1fr;
            }

            .item-grid {
                grid-template-columns: 1fr;
            }

            .componentes-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="contenedor">


    <!-- =========================================
         ENCABEZADO
    ========================================== -->

    <div class="encabezado">

        <div>

            <h1>
                Nuevo Pedido
            </h1>

            <div class="subtitulo">
                Cargar productos y kits para un cliente
            </div>

        </div>


        <div class="acciones-encabezado">

            <button
                type="button"
                class="boton-volver"
                onclick="volverPagina()"
            >
                ← VOLVER
            </button>


            <a
                href="{% url 'dashboard:inicio' %}"
                class="boton-inicio"
            >
                INICIO
            </a>

        </div>

    </div>


    <!-- =========================================
         MENSAJES
    ========================================== -->

    {% if messages %}

        {% for message in messages %}

            <div class="mensaje {{ message.tags }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <!-- =========================================
         FORMULARIO
    ========================================== -->

    <form method="post">

        {% csrf_token %}


        <!-- =====================================
             DATOS DEL PEDIDO
        ====================================== -->

        <div class="tarjeta">

            <div class="tarjeta-titulo">
                DATOS DEL PEDIDO
            </div>


            <div class="grid-principal">


                <!-- CLIENTE -->

                <div class="campo">

                    <label>
                        CLIENTE
                    </label>

                    <select
                        name="cliente"
                        id="cliente"
                        required
                        onchange="actualizarCliente()"
                    >

                        <option value="">
                            Seleccionar cliente...
                        </option>


                        {% for cliente in clientes %}

                            <option value="{{ cliente.id }}">
                                {{ cliente.nombre }}
                            </option>

                        {% endfor %}


                        <option value="NUEVO">
                            + Crear nuevo cliente
                        </option>

                    </select>

                </div>


                <!-- FECHA DE ENTREGA -->

                <div class="campo">

                    <label>
                        FECHA DE ENTREGA
                    </label>

                    <input
                        type="date"
                        name="fecha_entrega"
                    >

                </div>

            </div>


            <!-- =================================
                 NUEVO CLIENTE
            ================================== -->

            <div
                class="nuevo-cliente"
                id="nuevo-cliente"
            >

                <div class="nuevo-cliente-titulo">
                    NUEVO CLIENTE
                </div>


                <div class="nuevo-cliente-grid">


                    <div class="campo">

                        <label>
                            NOMBRE
                        </label>

                        <input
                            type="text"
                            name="nuevo_cliente_nombre"
                            id="nuevo_cliente_nombre"
                            placeholder="Nombre del cliente"
                        >

                    </div>


                    <div class="campo">

                        <label>
                            TELÉFONO
                        </label>

                        <input
                            type="text"
                            name="nuevo_cliente_telefono"
                            placeholder="Teléfono"
                        >

                    </div>


                    <div class="campo">

                        <label>
                            EMAIL
                        </label>

                        <input
                            type="email"
                            name="nuevo_cliente_email"
                            placeholder="Email"
                        >

                    </div>


                </div>

            </div>


            <!-- OBSERVACIONES -->

            <div
                class="campo"
                style="margin-top: 18px;"
            >

                <label>
                    OBSERVACIONES
                </label>

                <textarea
                    name="observaciones"
                    placeholder="Observaciones del pedido..."
                ></textarea>

            </div>

        </div>


        <!-- =====================================
             PRODUCTOS DEL PEDIDO
        ====================================== -->

        <div class="tarjeta">

            <div class="tarjeta-titulo">
                PRODUCTOS DEL PEDIDO
            </div>


            <div id="items">
            </div>


            <button
                type="button"
                class="boton boton-agregar"
                onclick="agregarItem()"
            >
                + AGREGAR PRODUCTO O KIT
            </button>

        </div>


        <!-- =====================================
             GUARDAR
        ====================================== -->

        <div class="acciones">

            <button
                type="submit"
                class="boton boton-guardar"
            >
                GUARDAR PEDIDO
            </button>

        </div>


    </form>

</div>


<script>

let contadorItems = 0;


/* =========================================
   VOLVER
========================================= */

function volverPagina() {

    if (window.history.length > 1) {

        window.history.back();

    } else {

        window.location.href =
            "{% url 'dashboard:inicio' %}";

    }

}


/* =========================================
   NUEVO CLIENTE
========================================= */

function actualizarCliente() {

    const cliente =
        document.getElementById(
            "cliente"
        );

    const bloque =
        document.getElementById(
            "nuevo-cliente"
        );

    const nombre =
        document.getElementById(
            "nuevo_cliente_nombre"
        );


    if (cliente.value === "NUEVO") {

        bloque.classList.add(
            "activo"
        );

        nombre.required = true;

    } else {

        bloque.classList.remove(
            "activo"
        );

        nombre.required = false;

    }

}


/* =========================================
   AGREGAR ITEM
========================================= */

function agregarItem() {

    contadorItems++;

    const indice =
        contadorItems;

    const contenedor =
        document.getElementById(
            "items"
        );


    const item =
        document.createElement(
            "div"
        );

    item.className =
        "item";

    item.id =
        `item-${indice}`;


    item.innerHTML = `

        <input
            type="hidden"
            name="item_indice"
            value="${indice}"
        >


        <div class="item-encabezado">

            <div class="item-numero">
                ITEM ${indice}
            </div>

            <button
                type="button"
                class="boton boton-eliminar"
                onclick="eliminarItem(${indice})"
            >
                ELIMINAR
            </button>

        </div>


        <div class="item-grid">


            <div class="campo">

                <label>
                    TIPO
                </label>

                <select
                    name="tipo_item_${indice}"
                    id="tipo_item_${indice}"
                    onchange="cambiarTipo(${indice})"
                    required
                >

                    <option value="PRODUCTO">
                        Producto
                    </option>

                    <option value="KIT">
                        Kit
                    </option>

                </select>

            </div>


            <div
                class="campo selector-producto-normal"
                id="bloque_producto_${indice}"
            >

                <label>
                    PRODUCTO
                </label>

                <select
                    name="producto_${indice}"
                    id="producto_${indice}"
                    required
                >

                    <option value="">
                        Seleccionar producto...
                    </option>

                    {% for producto in productos %}

                        <option value="{{ producto.id }}">
                            {{ producto.codigo }} - {{ producto.nombre }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div
                class="campo selector-kit"
                id="bloque_kit_${indice}"
            >

                <label>
                    KIT
                </label>

                <select
                    name="kit_${indice}"
                    id="kit_${indice}"
                    onchange="cargarProductosKit(${indice})"
                >

                    <option value="">
                        Seleccionar kit...
                    </option>

                    {% for kit in kits %}

                        <option value="{{ kit.id }}">
                            {{ kit.codigo }} - {{ kit.nombre }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="campo">

                <label>
                    CANTIDAD
                </label>

                <input
                    type="number"
                    name="cantidad_${indice}"
                    id="cantidad_${indice}"
                    min="1"
                    value="1"
                    required
                >

            </div>


        </div>


        <div
            class="componentes-kit"
            id="componentes_kit_${indice}"
        >

            <div class="componentes-titulo">
                PRODUCTOS DEL KIT
            </div>

            <div class="componentes-ayuda">
                Seleccioná los productos que contiene un kit.
                La cantidad indicada arriba multiplicará
                automáticamente estos productos.
            </div>

            <div
                class="componentes-grid"
                id="componentes_grid_${indice}"
            >
            </div>

        </div>

    `;


    contenedor.appendChild(
        item
    );


    actualizarBotonesEliminar();

}


/* =========================================
   ELIMINAR ITEM
========================================= */

function eliminarItem(indice) {

    const item =
        document.getElementById(
            `item-${indice}`
        );

    if (item) {
        item.remove();
    }

    actualizarBotonesEliminar();

}


/* =========================================
   BOTONES ELIMINAR
========================================= */

function actualizarBotonesEliminar() {

    const items =
        document.querySelectorAll(
            ".item"
        );

    const botones =
        document.querySelectorAll(
            ".boton-eliminar"
        );


    botones.forEach(
        boton => {

            boton.style.display =
                items.length > 1
                    ? "inline-block"
                    : "none";

        }
    );

}


/* =========================================
   CAMBIO PRODUCTO / KIT
========================================= */

function cambiarTipo(indice) {

    const tipo =
        document.getElementById(
            `tipo_item_${indice}`
        ).value;


    const bloqueProducto =
        document.getElementById(
            `bloque_producto_${indice}`
        );

    const bloqueKit =
        document.getElementById(
            `bloque_kit_${indice}`
        );

    const producto =
        document.getElementById(
            `producto_${indice}`
        );

    const kit =
        document.getElementById(
            `kit_${indice}`
        );

    const componentes =
        document.getElementById(
            `componentes_kit_${indice}`
        );

    const componentesGrid =
        document.getElementById(
            `componentes_grid_${indice}`
        );


    if (tipo === "KIT") {

        bloqueProducto.style.display =
            "none";

        bloqueKit.style.display =
            "block";


        producto.required =
            false;

        producto.value =
            "";


        kit.required =
            true;


    } else {

        bloqueProducto.style.display =
            "block";

        bloqueKit.style.display =
            "none";


        producto.required =
            true;

        kit.required =
            false;

        kit.value =
            "";


        componentes.classList.remove(
            "activo"
        );

        componentesGrid.innerHTML =
            "";

    }

}


/* =========================================
   CARGAR PRODUCTOS DEL KIT
========================================= */

async function cargarProductosKit(
    indice
) {

    const kitSelect =
        document.getElementById(
            `kit_${indice}`
        );

    const kitId =
        kitSelect.value;


    const bloque =
        document.getElementById(
            `componentes_kit_${indice}`
        );

    const grid =
        document.getElementById(
            `componentes_grid_${indice}`
        );


    grid.innerHTML =
        "";

    bloque.classList.remove(
        "activo"
    );


    if (!kitId) {
        return;
    }


    try {

        const respuesta =
            await fetch(
                `/pedidos/api/kit/${kitId}/productos/`
            );


        if (!respuesta.ok) {

            throw new Error(
                "No se pudieron cargar los productos del kit."
            );

        }


        const data =
            await respuesta.json();


        const cantidadProductos =
            data.kit.cantidad_productos;


        for (
            let posicion = 1;
            posicion <= cantidadProductos;
            posicion++
        ) {

            const campo =
                document.createElement(
                    "div"
                );

            campo.className =
                "componente-kit";


            const opciones =
                data.productos
                .map(
                    producto => `

                        <option value="${producto.id}">
                            ${producto.codigo} - ${producto.nombre}
                        </option>

                    `
                )
                .join("");


            campo.innerHTML = `

                <div class="campo">

                    <label>
                        PRODUCTO ${posicion}
                    </label>

                    <select
                        name="productos_kit_${indice}"
                        required
                    >

                        <option value="">
                            Seleccionar producto...
                        </option>

                        ${opciones}

                    </select>

                </div>

            `;


            grid.appendChild(
                campo
            );

        }


        bloque.classList.add(
            "activo"
        );


    } catch (error) {

        console.error(
            error
        );

        alert(
            "No se pudieron cargar los productos del kit."
        );

    }

}


/* =========================================
   INICIAR
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        agregarItem();

        actualizarCliente();

    }
);

</script>


</body>

</html>
