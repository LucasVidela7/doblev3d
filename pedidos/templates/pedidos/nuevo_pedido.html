<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Nuevo pedido | Doble V 3D</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        .item {
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .fila-item {
            display: grid;
            grid-template-columns:
                150px
                1fr
                100px
                100px;
            gap: 10px;
            align-items: end;
        }

        button {
            border: 0;
            border-radius: 7px;
            padding: 10px 16px;
            cursor: pointer;
        }

        .btn-agregar {
            background: #333;
            color: white;
        }

        .btn-guardar {
            background: #111;
            color: white;
            font-size: 16px;
            padding: 14px 24px;
        }

        .btn-eliminar {
            background: #ddd;
        }

        .componentes {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }

        .componente {
            margin-bottom: 10px;
        }

        .mensaje {
            padding: 12px;
            background: #eee;
            border-radius: 7px;
            margin-bottom: 15px;
        }

    </style>
</head>

<body>

<div class="contenedor">

    <h1>Nuevo pedido</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="mensaje">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="card">

            <div class="fila">

                <div>
                    <label>Cliente</label>

                    <select name="cliente" required>

                        <option value="">
                            Seleccionar cliente
                        </option>

                        {% for cliente in clientes %}

                            <option value="{{ cliente.id }}">
                                {{ cliente.codigo }} -
                                {{ cliente.nombre }}
                            </option>

                        {% endfor %}

                    </select>
                </div>

                <div>
                    <label>Fecha de entrega</label>

                    <input
                        type="date"
                        name="fecha_entrega"
                    >
                </div>

            </div>

            <div>
                <label>Observaciones</label>

                <textarea
                    name="observaciones"
                    rows="3"
                ></textarea>
            </div>

        </div>


        <div class="card">

            <h2>Productos del pedido</h2>

            <div id="items"></div>

            <button
                type="button"
                class="btn-agregar"
                onclick="agregarItem()"
            >
                + Agregar ítem
            </button>

        </div>


        <button
            type="submit"
            class="btn-guardar"
        >
            Guardar pedido
        </button>

    </form>

</div>


<script>

const PRODUCTOS = [

    {% for producto in productos %}

    {
        id: "{{ producto.id }}",
        codigo: "{{ producto.codigo }}",
        nombre: "{{ producto.nombre|escapejs }}"
    },

    {% endfor %}

];


const KITS = [

    {% for kit in kits %}

    {
        id: "{{ kit.id }}",
        codigo: "{{ kit.codigo }}",
        nombre: "{{ kit.nombre|escapejs }}"
    },

    {% endfor %}

];


let contadorItems = 0;


function agregarItem() {

    contadorItems++;

    const indice = contadorItems;

    const contenedor = document.getElementById("items");

    const item = document.createElement("div");

    item.className = "item";

    item.id = `item_${indice}`;

    item.innerHTML = `

        <input
            type="hidden"
            name="item_indice"
            value="${indice}"
        >

        <div class="fila-item">

            <div>

                <label>Tipo</label>

                <select
                    name="tipo_item_${indice}"
                    onchange="cambiarTipo(${indice})"
                    required
                >
                    <option value="PRODUCTO">
                        Producto
                    </option>

                    <option value="KIT">
                        Kit
                    </option>
                </select>

            </div>


            <div id="selector_${indice}">
            </div>


            <div>

                <label>Cantidad</label>

                <input
                    type="number"
                    name="cantidad_${indice}"
                    id="cantidad_${indice}"
                    min="1"
                    value="1"
                    onchange="actualizarKit(${indice})"
                    required
                >

            </div>


            <div>

                <button
                    type="button"
                    class="btn-eliminar"
                    onclick="eliminarItem(${indice})"
                >
                    Quitar
                </button>

            </div>

        </div>


        <div
            id="componentes_${indice}"
            class="componentes"
            style="display:none"
        ></div>
    `;

    contenedor.appendChild(item);

    mostrarProductos(indice);
}


function cambiarTipo(indice) {

    const tipo = document.querySelector(
        `[name="tipo_item_${indice}"]`
    ).value;

    const componentes = document.getElementById(
        `componentes_${indice}`
    );

    componentes.innerHTML = "";
    componentes.style.display = "none";

    if (tipo === "PRODUCTO") {

        mostrarProductos(indice);

    } else {

        mostrarKits(indice);

    }
}


function mostrarProductos(indice) {

    const selector = document.getElementById(
        `selector_${indice}`
    );

    let opciones = `
        <option value="">
            Seleccionar producto
        </option>
    `;

    PRODUCTOS.forEach(producto => {

        opciones += `
            <option value="${producto.id}">
                ${producto.codigo} - ${producto.nombre}
            </option>
        `;

    });

    selector.innerHTML = `

        <label>Producto</label>

        <select
            name="producto_${indice}"
            required
        >
            ${opciones}
        </select>
    `;
}


function mostrarKits(indice) {

    const selector = document.getElementById(
        `selector_${indice}`
    );

    let opciones = `
        <option value="">
            Seleccionar kit
        </option>
    `;

    KITS.forEach(kit => {

        opciones += `
            <option value="${kit.id}">
                ${kit.codigo} - ${kit.nombre}
            </option>
        `;

    });

    selector.innerHTML = `

        <label>Kit</label>

        <select
            name="kit_${indice}"
            id="kit_${indice}"
            onchange="actualizarKit(${indice})"
            required
        >
            ${opciones}
        </select>
    `;
}


async function actualizarKit(indice) {

    const tipo = document.querySelector(
        `[name="tipo_item_${indice}"]`
    );

    if (!tipo || tipo.value !== "KIT") {
        return;
    }

    const selectorKit = document.getElementById(
        `kit_${indice}`
    );

    if (!selectorKit || !selectorKit.value) {
        return;
    }

    const cantidadPedido = parseInt(
        document.getElementById(
            `cantidad_${indice}`
        ).value
    ) || 1;


    const respuesta = await fetch(
        `/pedidos/api/kit/${selectorKit.value}/productos/`
    );

    const datos = await respuesta.json();

    const contenedor = document.getElementById(
        `componentes_${indice}`
    );

    contenedor.style.display = "block";

    contenedor.innerHTML = `
        <strong>
            Productos del kit
            (${datos.kit.tipo})
        </strong>
        <br><br>
    `;

    const cantidadTotal =
        datos.kit.cantidad_productos
        * cantidadPedido;


    for (
        let posicion = 1;
        posicion <= cantidadTotal;
        posicion++
    ) {

        const div = document.createElement("div");

        div.className = "componente";

        let opciones = `
            <option value="">
                Seleccionar producto
            </option>
        `;

        datos.productos.forEach(producto => {

            opciones += `
                <option value="${producto.id}">
                    ${producto.codigo} -
                    ${producto.nombre}
                </option>
            `;

        });


        div.innerHTML = `

            <label>
                Producto ${posicion}
            </label>

            <select
                name="componentes_${indice}"
                required
            >
                ${opciones}
            </select>
        `;

        contenedor.appendChild(div);
    }
}


function eliminarItem(indice) {

    const item = document.getElementById(
        `item_${indice}`
    );

    if (item) {
        item.remove();
    }
}


agregarItem();

</script>

</body>
</html>
