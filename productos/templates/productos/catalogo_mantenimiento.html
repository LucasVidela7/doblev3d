{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Doble V 3D | Mantenimiento</title>
    <link rel="icon" href="{% static 'brand/favicon.ico' %}">
    <style>
        :root{
            --blue:#134a9a;
            --blue-dark:#0d376f;
            --red:#f0393b;
            --ink:#17233a;
            --muted:#667085;
            --line:#dfe5ef;
            --soft:#f5f7fb;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            min-height:100vh;
            display:grid;
            place-items:center;
            padding:24px;
            color:var(--ink);
            background:
                radial-gradient(circle at 12% 12%,rgba(19,74,154,.10),transparent 28rem),
                radial-gradient(circle at 88% 88%,rgba(240,57,59,.08),transparent 30rem),
                var(--soft);
            font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        }
        .card{
            width:min(620px,100%);
            padding:clamp(30px,7vw,58px);
            text-align:center;
            border:1px solid var(--line);
            border-radius:30px;
            background:#fff;
            box-shadow:0 18px 50px rgba(18,31,52,.10);
        }
        .logo{
            width:110px;
            height:84px;
            object-fit:contain;
            margin:0 auto 20px;
        }
        .eyebrow{
            margin:0 0 9px;
            color:var(--red);
            font-size:.75rem;
            font-weight:950;
            letter-spacing:.12em;
            text-transform:uppercase;
        }
        h1{
            margin:0;
            color:var(--blue-dark);
            font-size:clamp(2rem,8vw,3.9rem);
            line-height:.98;
            letter-spacing:-.05em;
        }
        p{
            max-width:470px;
            margin:18px auto 0;
            color:var(--muted);
            font-size:1rem;
            line-height:1.65;
        }
        .status{
            width:fit-content;
            margin:24px auto 0;
            padding:8px 12px;
            border-radius:999px;
            background:#eef4ff;
            color:var(--blue);
            font-size:.72rem;
            font-weight:900;
        }
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="{% static 'brand/logo.png' %}" alt="Doble V 3D">
        <p class="eyebrow">Doble V 3D</p>
        <h1>Estamos haciendo unos ajustes.</h1>
        <p>
            {{ mensaje_mantenimiento|default:"La tienda está temporalmente en mantenimiento. Volvé a visitarnos en unos minutos." }}
        </p>
        <div class="status">VOLVEMOS PRONTO</div>
    </main>
</body>
</html>
