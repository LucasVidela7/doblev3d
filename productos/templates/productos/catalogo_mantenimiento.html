{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Doble V 3D | Mantenimiento</title>
    <link rel="icon" href="{% static 'brand/favicon.ico' %}">
    <style>
        :root{
            --blue:#134a9a;
            --blue-dark:#0d376f;
            --red:#f0393b;
            --ink:#17233a;
            --muted:#667085;
            --line:#dfe5ef;
            --soft:#f5f7fb;
        }
        *{box-sizing:border-box}
        html,body{
            width:100%;
            height:100%;
            overflow:hidden;
        }
        body{
            margin:0;
            height:100dvh;
            min-height:0;
            display:grid;
            place-items:center;
            padding:clamp(12px,3vw,24px);
            color:var(--ink);
            background:
                radial-gradient(circle at 12% 12%,rgba(19,74,154,.10),transparent 28rem),
                radial-gradient(circle at 88% 88%,rgba(240,57,59,.08),transparent 30rem),
                var(--soft);
            font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        }
        .card{
            width:min(620px,100%);
            max-height:calc(100dvh - 24px);
            overflow:hidden;
            padding:clamp(24px,5vw,52px);
            text-align:center;
            border:1px solid var(--line);
            border-radius:30px;
            background:#fff;
            box-shadow:0 18px 50px rgba(18,31,52,.10);
        }
        .logo{
            width:110px;
            height:84px;
            object-fit:contain;
            margin:0 auto 20px;
        }
        .eyebrow{
            margin:0 0 9px;
            color:var(--red);
            font-size:.75rem;
            font-weight:950;
            letter-spacing:.12em;
            text-transform:uppercase;
        }
        h1{
            margin:0;
            color:var(--blue-dark);
            font-size:clamp(2rem,8vw,3.9rem);
            line-height:.98;
            letter-spacing:-.05em;
        }
        p{
            max-width:470px;
            margin:18px auto 0;
            color:var(--muted);
            font-size:1rem;
            line-height:1.65;
        }
        .status{
            width:fit-content;
            margin:24px auto 0;
            padding:8px 12px;
            border-radius:999px;
            background:#eef4ff;
            color:var(--blue);
            font-size:.72rem;
            font-weight:900;
        }
        .legal-links{
            display:flex;
            flex-wrap:wrap;
            align-items:center;
            justify-content:center;
            gap:6px 9px;
            margin-top:16px;
        }
        .legal-links a{
            color:var(--blue);
            font-size:.68rem;
            font-weight:850;
            text-decoration:none;
        }
        .legal-links a:hover,
        .legal-links a:focus-visible{
            text-decoration:underline;
        }
        .legal-separator{
            color:#a8b0bd;
            font-size:.72rem;
            font-weight:800;
            line-height:1;
            user-select:none;
        }
        @media(max-width:640px){
            .card{
                width:min(560px,100%);
                padding:clamp(24px,5vh,40px) 22px;
                border-radius:24px;
            }
            .logo{
                width:94px;
                height:72px;
                margin-bottom:14px;
            }
            h1{
                font-size:clamp(2rem,11vw,3.15rem);
            }
            p{
                margin-top:14px;
                font-size:.96rem;
                line-height:1.5;
            }
            .status{
                margin-top:18px;
            }
        }
        @media(max-height:720px){
            .card{
                padding-top:22px;
                padding-bottom:22px;
            }
            .logo{
                width:80px;
                height:60px;
                margin-bottom:10px;
            }
            .eyebrow{
                margin-bottom:7px;
                font-size:.68rem;
            }
            h1{
                font-size:clamp(1.75rem,8vh,2.75rem);
            }
            p{
                margin-top:11px;
                font-size:.88rem;
                line-height:1.4;
            }
            .status{
                margin-top:14px;
                padding:7px 10px;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="{% static 'brand/logo.png' %}" alt="Doble V 3D">
        <p class="eyebrow">Doble V 3D</p>
        <h1>Estamos haciendo unos ajustes.</h1>
        <p>
            {{ mensaje_mantenimiento|default:"La tienda está temporalmente en mantenimiento. Volvé a visitarnos en unos minutos." }}
        </p>
        <div class="status">VOLVEMOS PRONTO</div>
        <nav class="legal-links" aria-label="Información legal">
            <a href="{% url 'catalogo_terminos' %}">Términos</a>
            <span class="legal-separator" aria-hidden="true">·</span>
            <a href="{% url 'catalogo_privacidad' %}">Privacidad</a>
            <span class="legal-separator" aria-hidden="true">·</span>
            <a href="{% url 'catalogo_arrepentimiento' %}">BOTÓN DE ARREPENTIMIENTO</a>
        </nav>
    </main>
</body>
</html>
