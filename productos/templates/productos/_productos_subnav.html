<style>
.dv-products-subnav{
    display:flex;
    align-items:center;
    gap:6px;
    margin:0 0 14px;
    padding:5px;
    width:max-content;
    max-width:100%;
    border:1px solid var(--dv-border,#dfe5ef);
    border-radius:13px;
    background:var(--dv-surface,#fff);
    box-shadow:var(--dv-shadow-soft,0 4px 14px rgba(19,74,154,.055));
}
.dv-products-subnav a{
    min-height:38px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0 13px;
    border-radius:9px;
    color:var(--dv-muted,#667085);
    text-decoration:none;
    font-size:12px;
    font-weight:900;
    white-space:nowrap;
}
.dv-products-subnav a:hover{
    background:var(--dv-surface-soft,#f8faff);
    color:var(--dv-text,#17233a);
}
.dv-products-subnav a.is-active{
    background:var(--dv-brand-blue-soft,#eef4ff);
    color:var(--dv-accent-blue-text,#0d376f);
}
.dv-products-subnav a.nav-insumos.is-active{
    background:color-mix(in srgb,#38a7e8 16%,var(--dv-surface,#fff));
    color:color-mix(in srgb,#1677b8 88%,var(--dv-text,#17233a));
}
.dv-products-subnav a.nav-compras.is-active{
    background:color-mix(in srgb,#35b56f 16%,var(--dv-surface,#fff));
    color:color-mix(in srgb,#18834a 88%,var(--dv-text,#17233a));
}
.dv-products-subnav a.nav-empaques.is-active{
    background:color-mix(in srgb,#f0a63a 18%,var(--dv-surface,#fff));
    color:color-mix(in srgb,#b76a08 88%,var(--dv-text,#17233a));
}
@media(max-width:640px){
    .dv-products-subnav{width:100%;overflow-x:auto}
    .dv-products-subnav a{flex:1;min-width:max-content}
}
</style>
<nav class="dv-products-subnav" aria-label="Secciones de productos">
    <a
        href="{% url 'productos:lista' %}"
        class="{% if request.resolver_match.namespace == 'productos' and request.resolver_match.url_name != 'insumos' and request.resolver_match.url_name != 'insumo_nuevo' and request.resolver_match.url_name != 'insumo_editar' and request.resolver_match.url_name != 'compras_insumos' and request.resolver_match.url_name != 'compra_insumo_registrar' and request.resolver_match.url_name != 'categorias_seo' %}is-active{% endif %}"
    >PRODUCTOS</a>
    <a
        href="{% url 'productos:insumos' %}"
        class="nav-insumos {% if request.resolver_match.url_name == 'insumos' or request.resolver_match.url_name == 'insumo_nuevo' or request.resolver_match.url_name == 'insumo_editar' %}is-active{% endif %}"
    >INSUMOS</a>
    <a
        href="{% url 'productos:compras_insumos' %}"
        class="nav-compras {% if request.resolver_match.url_name == 'compras_insumos' or request.resolver_match.url_name == 'compra_insumo_registrar' %}is-active{% endif %}"
    >COMPRAS</a>
    <a
        href="{% url 'productos:categorias_seo' %}"
        class="{% if request.resolver_match.url_name == 'categorias_seo' %}is-active{% endif %}"
    >CATEGORÍAS SEO</a>
    <a
        href="{% url 'pedidos:reglas_empaque' %}"
        class="nav-empaques {% if request.resolver_match.namespace == 'pedidos' and request.resolver_match.url_name == 'reglas_empaque' %}is-active{% endif %}"
    >EMPAQUES</a>
</nav>
