{% load static %}
<link rel="stylesheet" href="{% static 'productos/catalog_cart.css' %}">
<div class="dv-site-loader" data-dv-site-loader aria-hidden="true">
    <div class="dv-site-loader__card" role="status" aria-live="polite">
        <img src="{% static 'brand/logo.png' %}" alt="">
        <span class="dv-site-loader__spinner" aria-hidden="true"></span>
        <strong>Cargando...</strong>
        <small>Preparando la tienda</small>
    </div>
</div>
<div data-dv-cart-root data-pricing-url="{% url 'catalogo_carrito_precios' %}">
    <div class="dv-cart-overlay" data-dv-cart-overlay></div>
    <aside class="dv-cart-drawer" data-dv-cart-drawer aria-label="Carrito de compras">
        <div class="dv-cart-head">
            <div class="dv-cart-head-copy">
                <h2>Tu carrito</h2>
                <p>Revisá productos, kits y cantidades.</p>
            </div>
            <button class="dv-cart-close" type="button" data-dv-cart-close aria-label="Cerrar carrito">×</button>
        </div>
        <div class="dv-cart-body" data-dv-cart-body>
            <div class="dv-cart-skeleton">
                <div class="dv-cart-skeleton-row"></div>
                <div class="dv-cart-skeleton-row"></div>
            </div>
        </div>
        <div class="dv-cart-foot">
            <div class="dv-cart-total">
                <span>TOTAL PRODUCTOS</span>
                <strong data-dv-cart-total>$ 0</strong>
            </div>
            <div class="dv-cart-total-saving is-empty" data-dv-cart-saving aria-live="polite"></div>
            <a class="dv-cart-checkout is-disabled" data-dv-cart-checkout href="{% url 'catalogo_carrito' %}">
                CONTINUAR
            </a>
            <p class="dv-cart-delivery-note">Entrega a coordinar · no incluida en este total.</p>
        </div>
        <div class="dv-cart-toast" data-dv-cart-toast role="status" aria-live="polite"></div>
    </aside>
</div>
<script src="{% static 'productos/catalog_cart.js' %}" defer></script>
