name: Android · Doble V Gestión Producción

on:
  push:
    branches:
      - android-production
    paths:
      - "android-app/**"
      - ".github/workflows/android-production-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/android-production-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK debug
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Renombrar APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk DobleV-Gestion-Produccion-v1.0.0.apk

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DobleV-Gestion-Produccion-v1.0.0
          path: DobleV-Gestion-Produccion-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
